# Opsi "Docker Compose" di Coolify (hanya cabang deploy-external). Panduan: docs/DEPLOY_EXTERNAL.md
#
# Beda dengan docker-compose.prod.yml: tanpa Caddy dan tanpa `ports:`. HTTPS dan routing domain dilakukan proxy Coolify (Traefik);
# atur domain pada layanan `app` di UI Coolify (https://video.contoh.com:3001).
# Semua variabel diisi di UI Coolify (Environment Variables), bukan file .env di server.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di Environment Variables}
      POSTGRES_DB: ccp
      TZ: Asia/Jakarta
    volumes:
      - ccp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ccp -d ccp']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ccp:${POSTGRES_PASSWORD}@db:5432/ccp
      PORT: '3001'
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
    expose:
      - '3001'

volumes:
  ccp-pgdata:
