name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ccp, POSTGRES_PASSWORD: ccp, POSTGRES_DB: ccp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ccp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ccp:ccp@localhost:5432/ccp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    # Memastikan image produksi bisa dibangun dan hidup bersama Postgres sungguhan (uji asap yang sama dengan scripts/smoke.sh).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ccp-video:ci .
      - name: Uji asap image
        run: |
          docker network create ccp
          docker run -d --name db --network ccp -e POSTGRES_USER=ccp -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ccp postgres:16-alpine
          until docker exec db pg_isready -U ccp; do sleep 1; done
          docker run -d --name app --network ccp -p 3001:3001 -e DATABASE_URL=postgres://ccp:ci@db:5432/ccp -e COOKIE_SECURE=false ccp-video:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3001/api/health && break; sleep 1; done
          ./scripts/smoke.sh http://localhost:3001
      - if: failure()
        run: docker logs app
